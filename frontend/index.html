<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YojnaSearch — Indian Government Schemes</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            saffron: { 400: '#fb923c', 500: '#f97316', 600: '#ea580c' },
          },
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; }

    /* Tricolor top bar */
    .tricolor { background: linear-gradient(to right, #FF9933 33%, #fff 33% 66%, #138808 66%); }

    /* Shimmer animation for skeletons */
    @keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:.4} }
    .skeleton { animation: shimmer 1.5s ease-in-out infinite; }

    /* Smooth card entrance */
    @keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .animate-in { animation: slideUp .35s ease-out forwards; }

    /* Collapsible section toggle */
    details > summary { cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    details[open] .chevron { transform: rotate(180deg); }
    .chevron { transition: transform .2s; }
  </style>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col text-slate-900">

  <!-- Tricolor accent bar -->
  <div class="tricolor h-1 w-full"></div>

  <!-- ── Header ── -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
      <span class="text-2xl">🇮🇳</span>
      <div>
        <p class="text-base font-bold leading-tight">YojnaSearch</p>
        <p class="text-xs text-slate-500">Discover Indian Government Schemes</p>
      </div>
    </div>
  </header>

  <!-- ── Hero / Search ── -->
  <section class="bg-white pt-12 pb-8 px-4 border-b border-slate-100">
    <div class="max-w-2xl mx-auto text-center">
      <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-2">
        Find schemes made for <span class="text-saffron-500">you</span>
      </h1>
      <p class="text-slate-500 text-sm mb-8">
        Describe yourself in plain language — your state, job, age, or situation.
      </p>

      <div class="flex justify-end mb-2">
        <label for="languageSelect" class="sr-only">Response language</label>
        <select id="languageSelect" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 focus:border-saffron-500 focus:outline-none">
          <option value="english">English</option>
          <option value="hindi">हिंदी</option>
        </select>
      </div>

      <!-- Search form -->
      <form id="searchForm" class="flex items-center bg-white rounded-2xl border-2 border-slate-200
                                    focus-within:border-saffron-500 shadow-lg transition-colors">
        <span class="pl-4 text-xl text-slate-400">🔍</span>
        <input
          id="queryInput"
          type="text"
          placeholder='e.g. "I am a 30 year old female farmer from Rajasthan earning under ₹2 lakh"'
          class="flex-1 px-4 py-4 text-sm bg-transparent focus:outline-none placeholder-slate-400"
        />
        <div class="pr-2">
          <button
            id="searchBtn"
            type="submit"
            class="px-5 py-2.5 rounded-xl bg-saffron-500 text-white text-sm font-semibold
                   hover:bg-saffron-600 transition-colors disabled:opacity-40 disabled:cursor-not-allowed
                   flex items-center gap-2"
          >
            <span id="btnText">Search</span>
            <svg id="spinner" class="hidden animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
          </button>
        </div>
      </form>
    </div>
  </section>

  <!-- ── Results area ── -->
  <main class="flex-1 max-w-3xl mx-auto w-full px-4 py-8" id="results"></main>

  <!-- ── Footer ── -->
  <footer class="border-t border-slate-200 bg-white">
    <p class="text-center text-xs text-slate-400 py-4">
      Data sourced from official Indian government portals. Always verify eligibility directly.
    </p>
  </footer>

  <!-- The index page is served at `/`, while static assets live under
       `/frontend`; use an absolute path so the browser can always load the
       search event handlers. -->
  <script src="/frontend/app.js"></script>
</body>
</html>
