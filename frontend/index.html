<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indian Government Schemes Finder</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<header>
  <div class="flag-stripe"><span></span><span></span><span></span></div>
  <h1>Indian <span>Government Schemes</span> Finder</h1>
  <p>Powered by RAG + Groq LLM — discover schemes you are eligible for</p>
</header>

<main>
  <!-- Search Box -->
  <div class="search-card">
    <label class="search-label" for="queryInput">Describe your situation</label>
    <div class="search-row">
      <input
        type="text"
        id="queryInput"
        placeholder="e.g. I am a farmer from Maharashtra looking for crop insurance..."
        autocomplete="off"
      />
      <button id="searchBtn" onclick="runSearch()">Search</button>
    </div>
    <div class="example-queries">
      <span>Try:</span>
      <button class="chip" onclick="setQuery(this)">Farmer from Gujarat</button>
      <button class="chip" onclick="setQuery(this)">Woman entrepreneur in Rajasthan</button>
      <button class="chip" onclick="setQuery(this)">Student scholarship Delhi</button>
      <button class="chip" onclick="setQuery(this)">Senior citizen pension scheme</button>
      <button class="chip" onclick="setQuery(this)">BPL family housing Bihar</button>
    </div>
  </div>

  <!-- Status bar -->
  <div id="statusBar">
    <div class="spinner"></div>
    <span id="statusText">Searching schemes...</span>
  </div>

  <!-- Error Alert -->
  <div id="errorBox"></div>

  <!-- Parsed info pills -->
  <div id="parsedInfo"></div>

  <!-- Summary Card -->
  <div id="summaryCard">
    <div class="label">AI Summary</div>
    <div id="summaryText"></div>
  </div>

  <!-- Results List -->
  <div id="results"></div>

  <!-- Empty State -->
  <div id="emptyState">
    <div class="emoji">🔍</div>
    <p>No matching schemes found.<br>Try rephrasing your query with more details.</p>
  </div>

  <!-- Important Note / Disclaimer -->
  <div id="importantNote">
    <div class="note-label">⚠️ Important Note</div>
    <div id="noteText"></div>
  </div>
</main>

<footer>
  Built with FastAPI + ChromaDB + FastEmbed + Groq &nbsp;|&nbsp;
  <a href="/docs" target="_blank">API Docs</a>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
