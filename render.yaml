services:
  - type: web
    name: govt-scheme-search
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      # Free instances have an ephemeral filesystem. Allow the embedding model
      # to download after a cold start when no cache is available.
      - key: EMBEDDING_LOCAL_FILES_ONLY
        value: "false"
      # Render prompts for this secret on the initial Blueprint deployment.
      - key: GROQ_API_KEY
        sync: false
